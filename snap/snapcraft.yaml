name: openmukti-audiobook-maker
base: core24
version: '1.0.0'
summary: Offline text-to-speech and audiobook video creator
description: |
  Openmukti Audiobook Maker provides an offline speech editor, command line tools,
  audio processing, and illustrated audiobook video export using FFmpeg.
grade: devel
confinement: strict
license: MIT
apps:
  openvoice:
    command: bin/openvoice-gui
    plugs: [home, removable-media, x11, wayland, audio-playback, desktop, desktop-legacy]
  cli:
    command: bin/openvoice
    plugs: [home, removable-media, audio-playback]
parts:
  openvoice:
    plugin: python
    source: .
    python-packages: ['.']
    stage-packages: [python3-tk, espeak-ng, ffmpeg]
