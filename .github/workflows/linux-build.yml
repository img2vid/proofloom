name: Build Linux editions
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk espeak-ng ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd xvfb
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install '.[dev,ocr]'
      - run: python -m pytest -q
        env:
          PYTHONPATH: .
      - run: python packaging/build_release.py native --strict
      - run: python packaging/build_linux.py
      - run: dist/OpenmuktiAudiobookMakerCMD media-tools --json
      - uses: actions/upload-artifact@v4
        with:
          name: Openmukti-Audiobook-Maker-Linux-${{ matrix.arch }}
          path: |
            dist/*.pyz
            dist/*.tar.gz
            dist/*.deb
            dist/Openmukti-Audiobook-Maker
            dist/OpenmuktiAudiobookMakerCMD
