name: Build Windows EXEs
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
          architecture: ${{ matrix.architecture }}
      - name: Install build-time Tesseract OCR and English data
        run: choco install tesseract --yes --no-progress
      - run: python scripts/build_windows_py315.py
        env:
          OPENMUKTI_TESSERACT_DIR: C:\Program Files\Tesseract-OCR
      - run: dist\OpenmuktiAudiobookMakerCMD.exe media-tools --json
      - run: dist\OpenmuktiAudiobookMakerCMD.exe ocr --status
      - run: dist\OpenmuktiOCRWorker.exe --health
      - uses: actions/upload-artifact@v4
        with:
          name: Openmukti-Audiobook-Maker-Windows-${{ matrix.architecture }}
          path: |
            dist/OpenmuktiAudiobookMaker.exe
            dist/OpenmuktiAudiobookMakerCMD.exe
            dist/*.zip
